[package]
name = "drsg-plugin-rust"
description = "The drsg rust preprocessor plugin: the parser, wrapped for the wasm contract"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

# The SDK, the parser, and the serializer the partial format uses — nothing
# else of drsg's. This is the same position a third-party author is in, and the
# claim is checked (`cargo tree` must show no dr-strange-core, no wasmtime).
[dependencies]
dr-strange-ext = { path = "../../../sdk/rust" }
drsg-rust-parser = { path = "../parser" }
serde_json = "1"
# The partial format. Binary and self-describing: self-describing because the
# facts carry `serde_json::Value` properties, which only a self-describing
# format can decode; binary because the partials for a large tree are
# megabytes, and encoding them as JSON text was a measurable share of a run.
rmp-serde = "1"

[workspace]
members = []
