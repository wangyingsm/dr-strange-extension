[package]
name = "drsg-rust-parser"
description = "Rust source → graph facts, at interface level — the parsing half of the drsg rust plugin"
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
# The parser is deliberately free of every dr-strange crate: its properties are
# the JSON the contract carries, and its host access is one small trait. That
# is what lets its tests run natively while the component wraps it for wasm.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = []
