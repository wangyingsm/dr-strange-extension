[package]
name = "drsg-py-parser"
description = "Python into facts — the parsing half of the drsg py plugin"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# ruff's parser rather than a hand one: the parser behind ruff and uv, pure
# Rust, current with the language. Parse-only — no type inference, which is
# the point: facts a parser is certain of, nothing a checker would infer.
[dependencies]
ruff_python_parser = "0.0.9"
ruff_python_ast = "0.0.9"
ruff_source_file = "0.0.9"
ruff_text_size = "0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The route convention (`dr_strange_ext::route`) — one definition of what a
# declaration and a request compare against, shared with every other plugin.
# The SDK is otherwise the component's dependency, not the parser's.
dr-strange-ext = { path = "../../../sdk/rust" }

[workspace]
members = []

# `clippy::too_many_lines` is deliberately absent here, unlike the other
# gated crates: this parser still has functions over the limit, and turning
# the lint on before they are split would turn CI red. Add it with them.
