[package]
name = "drsg-plugin-toml"
description = "A minimal dr-strange preprocessor plugin — proof the contract is implementable from the SDK alone"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

# The SDK and nothing else of ours. This is the position a third-party author
# is in, and the reason it is checked rather than assumed.
[dependencies]
dr-strange-ext = { path = "../../sdk/rust" }

[workspace]
members = []
