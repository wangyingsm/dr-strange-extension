[package]
name = "drsg-plugin-deps"
description = "A dr-strange preprocessor plugin for build manifests — what a project declares it depends on"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

# The SDK and the readers each format needs, and nothing else of ours — the
# position a third-party author is in.
[dependencies]
dr-strange-ext = { path = "../../sdk/rust" }
serde_json = "1"
toml_edit = { version = "0.22", default-features = false, features = ["parse"] }
# `pom.xml` is XML, and a scan for angle brackets is the kind of guess this
# family refuses; quick-xml is pure Rust and reads it properly.
quick-xml = { version = "0.37", default-features = false }

[workspace]
members = []

[lints.clippy]
too_many_lines = "warn"
