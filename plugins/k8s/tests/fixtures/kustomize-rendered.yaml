apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    tier: web
  name: api
  namespace: prod
spec:
  selector:
    matchLabels:
      tier: web
  template:
    metadata:
      labels:
        app: api
        tier: web
    spec:
      containers:
      - image: ghcr.io/acme/api:sha-abc1234
        name: api
