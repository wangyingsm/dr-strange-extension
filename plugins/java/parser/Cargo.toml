[package]
name = "drsg-java-parser"
description = "Java into facts — the parsing half of the drsg java plugin"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# tree-sitter rather than a hand parser: no mature pure-Rust Java frontend
# exists, and the grammar everyone's editor already trusts is a better
# foundation than one we would have to earn trust for. The C runtime and
# grammar compile to wasm32-wasip2 under wasi-sdk's clang — the same
# toolchain that will carry the C and zig plugins later.
[dependencies]
tree-sitter = "0.26"
tree-sitter-java = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = []
