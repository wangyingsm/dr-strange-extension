[package]
name = "drsg-plugin-git"
description = "The drsg git preprocessor plugin: a repository's history, wrapped for the wasm contract"
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

# The SDK, the parser, and a serializer for the partial — nothing else of
# drsg's. The same position a third-party author is in, and the claim is
# checked: `cargo tree` must show no dr-strange-core and no wasmtime.
[dependencies]
dr-strange-ext = { path = "../../../sdk/rust" }
drsg-git-parser = { path = "../parser" }
serde_json = "1"
# The partial format. Binary and self-describing — self-describing because the
# facts carry `serde_json::Value` properties, which only a self-describing
# format can decode.
rmp-serde = "1"

[workspace]
members = []
