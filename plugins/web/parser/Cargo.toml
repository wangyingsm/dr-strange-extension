[package]
name = "drsg-web-parser"
description = "HTML and CSS into facts — the parsing half of the drsg web plugin"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# One plugin for both languages, deliberately: the cross-file facts a
# frontend plane wants — which stylesheet's class styles which page — can
# only be resolved where one assemble sees both sides.
[dependencies]
tree-sitter = "0.26"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-javascript = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = []
