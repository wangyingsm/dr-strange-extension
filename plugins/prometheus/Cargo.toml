[package]
name = "drsg-plugin-prometheus"
description = "A dr-strange preprocessor plugin for Prometheus — scrape jobs, alerting rules, and the services and metrics they name"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

# The SDK and a YAML loader, and nothing else of ours — the position a
# third-party author is in.
[dependencies]
dr-strange-ext = { path = "../../sdk/rust" }
# A loader rather than serde, for the reason the Compose plugin gives: a
# configuration's values are kept as written, so `${ENV}` and a relabelled
# `__address__` stay the strings the author typed.
yaml-rust2 = { version = "0.13", default-features = false }

[workspace]
members = []

[lints.clippy]
too_many_lines = "warn"
