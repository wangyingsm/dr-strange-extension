name: Release

# Each plugin releases at its own pace — that is the reason this repository
# exists apart from the database. Cut one by tagging `<plugin>-v<semver>`:
#
#   git tag rust-v2.0.0 && git push origin rust-v2.0.0
#
# The release carries `<plugin>.wasm` and its sha256; the installer is
#
#   drsg plugin install https://github.com/<owner>/<repo>/releases/download/<tag>/<plugin>.wasm
#
# and drsg pins the hash at install, re-checking it at every load.
#
# The `catalog` job then writes the new version, URL and hash into
# `catalog.json` on master — the list `drsg plugin install` reads, so a plugin
# release reaches every installed drsg without a drsg release. It updates the
# three mechanical fields and nothing else: `claims` and `min_drsg` are
# judgements a person makes when a plugin first enters the catalog.
on:
  push:
    tags:
      - "rust-v*"
      - "go-v*"
      - "ts-v*"
      - "py-v*"
      - "java-v*"
      - "c-v*"
      - "web-v*"
      - "toml-v*"
      - "deps-v*"
      - "git-v*"
      - "xml-v*"

permissions:
  contents: write # create the GitHub Release, upload assets, commit the catalog

# Two plugins tagged at once would otherwise race to commit `catalog.json`.
# Queued rather than cancelled: a superseded run here means a release whose
# catalog entry never lands.
concurrency:
  group: release-catalog
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  WASI_SDK_VERSION: "33.0"
  TINYGO_VERSION: "0.41.1"
  WASM_TOOLS_VERSION: "1.254.0"

jobs:
  plugin:
    name: Build and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Which plugin
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%%-v*}"
          case "$plugin" in
            toml|deps|xml)
                   artifact="plugins/$plugin/target/wasm32-wasip2/release/drsg_plugin_$plugin.wasm" ;;
            go)    artifact="plugins/go/component/go.wasm" ;;
            rust|ts|py|c|java|web|git)
                   artifact="plugins/$plugin/component/target/wasm32-wasip2/release/drsg_plugin_$plugin.wasm" ;;
            *)     echo "unknown plugin in tag: $tag"; exit 1 ;;
          esac
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: actions/setup-go@v5
        if: steps.meta.outputs.plugin == 'go'
        with:
          go-version-file: plugins/go/parser/go.mod
      - name: Install TinyGo
        if: steps.meta.outputs.plugin == 'go'
        run: |
          curl -sSfL -o /tmp/tinygo.tar.gz \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/tinygo.tar.gz -C "$HOME"
          echo "$HOME/tinygo/bin" >> "$GITHUB_PATH"
          # TinyGo's wasip2 target shells out to wasm-tools to lift the
          # module into a component.
          curl -sSfL -o /tmp/wasm-tools.tar.gz \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          tar -xzf /tmp/wasm-tools.tar.gz -C "$HOME"
          echo "$HOME/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Install wasi-sdk
        if: contains(fromJSON('["c", "java", "web"]'), steps.meta.outputs.plugin)
        run: |
          curl -sSfL -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME"
          echo "WASI_SDK=$HOME/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux" >> "$GITHUB_ENV"
      - uses: extractions/setup-just@v3
      - name: Build
        run: just "${{ steps.meta.outputs.plugin }}-plugin"
      - name: Stage artifact + checksum
        run: |
          mkdir -p dist
          cp "${{ steps.meta.outputs.artifact }}" "dist/${{ steps.meta.outputs.plugin }}.wasm"
          (cd dist && sha256sum "${{ steps.meta.outputs.plugin }}.wasm" > "${{ steps.meta.outputs.plugin }}.wasm.sha256")
          cat "dist/${{ steps.meta.outputs.plugin }}.wasm.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent: a rerun (or a race with an already-published release)
        # completes missing assets instead of failing on the existing
        # release — and never clobbers an asset already up there, because
        # installed drsg catalogs pin the published bytes by sha256.
        run: |
          plugin="${{ steps.meta.outputs.plugin }}"
          sha=$(cut -d' ' -f1 "dist/$plugin.wasm.sha256")
          if existing=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' 2>/dev/null); then
            echo "release $GITHUB_REF_NAME already exists — completing missing assets only"
            for f in "$plugin.wasm" "$plugin.wasm.sha256"; do
              if printf '%s\n' "$existing" | grep -qx "$f"; then
                echo "asset $f already published; leaving it untouched"
              else
                gh release upload "$GITHUB_REF_NAME" "dist/$f"
              fi
            done
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/$plugin.wasm" "dist/$plugin.wasm.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Install:

          \`\`\`
          drsg plugin install https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$plugin.wasm
          \`\`\`

          sha256: \`$sha\` — drsg pins this at install and re-checks it at every load."

  catalog:
    name: Record ${{ github.ref_name }} in catalog.json
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      # master, not the tag: the tag is a detached point in history and the
      # catalog lives on the branch.
      - uses: actions/checkout@v5
        with:
          ref: master
          # A push needs credentials that outlive the checkout step.
          persist-credentials: true
      - name: Update the entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          plugin="${tag%%-v*}"
          version="${tag#*-v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${plugin}.wasm"

          # The hash the release actually published — read back from the
          # release rather than recomputed, so what the catalog pins is what
          # an installer will download.
          sha=$(gh release view "$tag" --json assets \
                  -q '.assets[] | select(.name == "'"$plugin"'.wasm.sha256") | .url' \
                | xargs curl -sSfL | cut -d' ' -f1)
          if [ -z "$sha" ]; then
            echo "::error::$tag published no $plugin.wasm.sha256 to pin"
            exit 1
          fi

          rows=$(jq --arg n "$plugin" '[.plugins[] | select(.name == $n)] | length' catalog.json)
          if [ "$rows" = "0" ]; then
            echo "::warning::$plugin is not in catalog.json — add it by hand with its \`claims\` and \`min_drsg\`, which are judgements this workflow cannot make. The release is published either way; it just will not be offered by \`drsg plugin install\` until the entry exists."
            exit 0
          fi
          if [ "$rows" != "1" ]; then
            echo "::warning::catalog.json holds $rows entries for $plugin — several versions of one plugin is a deliberate compatibility arrangement, so this workflow will not guess which row to move. Update it by hand."
            exit 0
          fi

          jq --arg n "$plugin" --arg v "$version" --arg u "$url" --arg s "$sha" \
            '.plugins = [.plugins[] | if .name == $n then .version = $v | .url = $u | .sha256 = $s else . end]' \
            catalog.json > catalog.tmp && mv catalog.tmp catalog.json

          ./scripts/check-catalog.sh --online

          if git diff --quiet catalog.json; then
            echo "catalog.json already records $tag"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore(catalog): $plugin $version"
          # Another plugin's release may have landed between the checkout and
          # now; rebase onto it rather than failing the release over it.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin master && git push origin HEAD:master; then
              exit 0
            fi
            echo "push attempt $attempt lost a race — retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push the catalog entry for $tag after 3 attempts"
          exit 1
